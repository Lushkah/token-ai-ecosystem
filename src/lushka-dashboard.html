<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lushka Wallet</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#fff}main{max-width:900px;margin:auto;padding:24px}.card{background:#151c31;border:1px solid #293452;border-radius:16px;padding:18px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #394665;margin:5px;background:#0f1628;color:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.muted{color:#aeb8d0}.danger{color:#ff9b9b}</style></head><body><main><h1>🌿 Lushka Wallet</h1><p class="muted">Ethereum wallet + market intelligence + pre-transaction security.</p><div class="card"><h2>Create wallet</h2><button onclick="createWallet()">Create new wallet</button><pre id="newWallet"></pre></div><div class="card"><h2>Balance</h2><input id="address" placeholder="0x wallet address"><button onclick="balance()">Check ETH</button><p id="balance"></p></div><div class="card"><h2>Security Gate</h2><div class="grid"><input id="to" placeholder="Destination address"><input id="value" placeholder="ETH amount"><input id="data" placeholder="0x calldata (optional)"></div><button onclick="check()">Analyze transaction</button><pre id="check"></pre></div><div class="card"><h2>Send ETH</h2><p class="muted">For local/dev use only. Never paste a production private key into an untrusted frontend.</p><input id="pk" placeholder="Private key"><button onclick="send()">Send</button><pre id="send"></pre></div></main><script>async function api(path,opt){const r=await fetch(path,opt);return r.json()}async function createWallet(){document.querySelector('#newWallet').textContent=JSON.stringify(await api('/api/wallet/create',{method:'POST'}),null,2)}async function balance(){const a=document.querySelector('#address').value;document.querySelector('#balance').textContent=JSON.stringify(await api('/api/wallet/balance/'+a))}async function check(){const body={to:document.querySelector('#to').value,valueEth:document.querySelector('#value').value,data:document.querySelector('#data').value||'0x'};document.querySelector('#check').textContent=JSON.stringify(await api('/api/wallet/check-transaction',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),null,2)}async function send(){const body={privateKey:document.querySelector('#pk').value,to:document.querySelector('#to').value,valueEth:document.querySelector('#value').value,data:document.querySelector('#data').value||'0x'};document.querySelector('#send').textContent=JSON.stringify(await api('/api/wallet/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),null,2)}</script></body></html>
